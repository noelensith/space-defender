<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Space Defender</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <h1>SPACE DEFENDER</h1>
    <p class="creator">Created by Noelen Sihalath</p>
    <div id="scoreboard">SCORE: <span id="score">0</span> | LIVES: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="540" height="400"></canvas>
        <button id="playAgain" disabled>Play</button>    <div class="instructions">Use [←] [→] Arrow Keys to Move, Press [Spacebar] to Fire Torpedoes</div>
    <audio id="backgroundMusic" loop preload="auto">
        <source src="spacemusic.mp3" type="audio/mpeg">
    <script src="script.js" defer></script>
</body>
</html>
